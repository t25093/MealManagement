# Blueprint ל-Render: שרת API ואתר הלקוח במסלול החינמי.
# מסד הנתונים נמצא ב-Neon, וכתובת החיבור מוזנת ידנית ב-Environment של השרת.

services:
  # ===== שרת ה-API (Docker) =====
  - type: web
    name: meal-management-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ConnectionStrings__Default
        sync: false   # הכתובת מ-Neon, מוזנת ידנית ב-Render ולא נשמרת ב-GitHub
      - key: Jwt__Key
        generateValue: true
      - key: Cors__ClientUrl
        value: https://meal-management-client.onrender.com
      - key: Swagger__Enabled
        value: "true"

  # ===== אתר הלקוח (React + Vite) =====
  - type: web
    name: meal-management-client
    runtime: static
    repo: https://github.com/t25093/meal-management-client
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://meal-management-api-phyw.onrender.com
    routes:
      # React Router: כל כתובת מחזירה את index.html
      - type: rewrite
        source: /*
        destination: /index.html
